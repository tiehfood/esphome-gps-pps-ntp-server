substitutions:
  name: esp32-s3-eth-poe-02
  friendly_name: "ESP32 Time"
  id_prefix: "esp32_s3_02"

preferences:
  flash_write_interval: never
  
ota:
  - platform: esphome

api:
  reboot_timeout: 0s # do not reboot if hassio connection is lost.

debug:
  update_interval: 60s

web_server:
  port: 80
  version: 3
  local: True

esphome:
  name: ${name}
  friendly_name: ${friendly_name}
  name_add_mac_suffix: False 
  on_boot:
    # Trim the NMEA the module emits. ESPHome's gps component drains the whole UART
    # buffer each loop and calls every listener once per COMPLETE SENTENCE, so sentence
    # volume -- not byte rate -- is what costs main-loop time. With 25 satellites across
    # four constellations the GSV burst dominated it (gps loop max 135 ms).
    # Keep GGA and RMC every fix (time, date, fix quality, satellites-in-use); drop GLL,
    # GSA and VTG entirely (unused); downrate GSV to every 30th fix, which still feeds
    # the per-constellation satellite sensors.
    # Re-applied on every boot deliberately: there is no V_BCKP battery, so the module
    # loses this configuration on any power cycle.
    priority: -100
    then:
      - delay: 3s
      - uart.write: [0xB5, 0x62, 0x06, 0x01, 0x03, 0x00, 0xF0, 0x01, 0x00, 0xFB, 0x11]
      - delay: 120ms
      - uart.write: [0xB5, 0x62, 0x06, 0x01, 0x03, 0x00, 0xF0, 0x02, 0x00, 0xFC, 0x13]
      - delay: 120ms
      - uart.write: [0xB5, 0x62, 0x06, 0x01, 0x03, 0x00, 0xF0, 0x05, 0x00, 0xFF, 0x19]
      - delay: 120ms
      - uart.write: [0xB5, 0x62, 0x06, 0x01, 0x03, 0x00, 0xF0, 0x03, 0x1E, 0x1B, 0x33]
      - delay: 120ms
      - uart.write: [0xB5, 0x62, 0x06, 0x01, 0x03, 0x00, 0xF0, 0x00, 0x01, 0xFB, 0x10]
      - delay: 120ms
      - uart.write: [0xB5, 0x62, 0x06, 0x01, 0x03, 0x00, 0xF0, 0x04, 0x01, 0xFF, 0x18]
      - logger.log: "NMEA output trimmed: GLL/GSA/VTG off, GSV every 30th fix" 

ethernet:
  id: eth_component
  type: W5500
  clk_pin: GPIO13
  mosi_pin: GPIO11
  miso_pin: GPIO12
  cs_pin: GPIO14
  interrupt_pin: GPIO10
  reset_pin: GPIO09

esp32:
  variant: esp32s3 
  flash_size: 16MB
  framework:
    type: esp-idf

logger:
  baud_rate: 0
  level: DEBUG
  logs:
    ethernet: INFO
    gps_pps_time: INFO
    ntp_server: INFO
    sensor: INFO

psram:
  mode: octal
  speed: 80MHz

one_wire:
  - platform: gpio
    id: temperature_bus
    pin: GPIO3

uart:
  id: ${id_prefix}_uart
  rx_pin: GPIO44
  tx_pin: GPIO43
  baud_rate: 115200

gps:
  id: ${id_prefix}_gps
  uart_id: ${id_prefix}_uart

time:
  - platform: gps_pps_time
    id: ${id_prefix}_pps
    gps_id: ${id_prefix}_gps
    pps_pin: GPIO1
    update_interval: 60s
    satellites:
      id: ${id_prefix}_total_satellites
      name: "Satellites"
      icon: "mdi:satellite-variant"
      accuracy_decimals: 0
      state_class: measurement
      force_update: false
      disabled_by_default: false
      internal: false
    clock_offset:
      id: ${id_prefix}_clock_offset
      name: "Clock Offset"
      icon: "mdi:clock-check-outline"
      unit_of_measurement: "µs"
      accuracy_decimals: 0
      state_class: measurement
    nmea_clock_delta:                                                                                                                                                              
      id: nmea_clock_delta                                                                                                                                                         
      name: "NMEA Clock Delta"                                                                                                                                                     
      icon: "mdi:clock-alert"                                                                                                                                                      
      unit_of_measurement: "ms"                                                                                                                                                    
      accuracy_decimals: 0                                                                                                                                                         
      state_class: measurement                                                                                                                                                     
      entity_category: "diagnostic"
    pps_interval_ppb:
      id: ${id_prefix}_pps_interval_ppb
      name: "PPS Interval Error"
      icon: "mdi:sine-wave"
      unit_of_measurement: "ppb"
      accuracy_decimals: 0
      state_class: measurement
      entity_category: "diagnostic"
    pps_drift:
      id: ${id_prefix}_pps_raw_drift
      name: "PPS Drift"
      icon: "mdi:clock-alert-outline"
      unit_of_measurement: "µs"
      accuracy_decimals: 0
      state_class: measurement
    gps_satellites:
      id: ${id_prefix}_gps_sat_count
      name: "GPS Satellites"
      icon: "mdi:satellite-variant"
      accuracy_decimals: 0
      state_class: measurement
    galileo_satellites:
      id: ${id_prefix}_galileo_sat_count
      name: "Galileo Satellites"
      icon: "mdi:satellite-variant"
      accuracy_decimals: 0
      state_class: measurement
    crash_info:
      id: last_crash_info
      name: "Last Crash Info"
      icon: "mdi:alert-circle-outline"
      entity_category: "diagnostic"

ntp_server:
  id: ${id_prefix}_ntp
  time_id: ${id_prefix}_pps
  hook_latency:
    id: ${id_prefix}_ntp_hook_latency
    name: "NTP Hook Latency"
    icon: "mdi:timer-sand"
    unit_of_measurement: "µs"
    accuracy_decimals: 0
    state_class: measurement
    entity_category: "diagnostic"
  rx_stamp_gap:
    id: ${id_prefix}_ntp_rx_stamp_gap
    name: "NTP RX Stamp Gap"
    icon: "mdi:transfer-down"
    unit_of_measurement: "µs"
    accuracy_decimals: 0
    state_class: measurement
    entity_category: "diagnostic"
  t3_error:
    id: ${id_prefix}_ntp_t3_error
    name: "NTP T3 Prediction Error"
    icon: "mdi:target-variant"
    unit_of_measurement: "µs"
    accuracy_decimals: 0
    state_class: measurement
    entity_category: "diagnostic"
  int_lead:
    id: ${id_prefix}_ntp_int_lead
    name: "NTP INT Lead"
    icon: "mdi:flash-outline"
    unit_of_measurement: "µs"
    accuracy_decimals: 0
    state_class: measurement
    entity_category: "diagnostic"
  arp_primes:
    id: ${id_prefix}_ntp_arp_primes
    name: "NTP ARP Primes"
    icon: "mdi:lan-connect"
    accuracy_decimals: 0
    state_class: total_increasing
    entity_category: "diagnostic"
  # Requests refused because the receive path stalled (INTn to burst start >= 1 ms), the input
  # hook missed them entirely, or ARP never resolved before the wait bound.
  refused:
    id: ${id_prefix}_ntp_refused
    name: "NTP Refused Stalled"
    entity_category: "diagnostic"
  # Requests whose reply needed to resolve ARP before it could be sent (a cache miss).
  arp_waits:
    id: ${id_prefix}_ntp_arp_waits
    name: "NTP ARP Waits"
    icon: "mdi:lan-alert"
    entity_category: "diagnostic"
  # W5500 Sn_CR handshake diagnostics, per 10 s window: commands needing more than one poll
  # (each cost a 10 ms sleep in the stock driver) and the longest write-to-cleared time.
  w5500_cmd_retries:
    id: ${id_prefix}_w5500_cmd_retries
    name: "W5500 Command Retries"
    entity_category: "diagnostic"
  w5500_cmd_max:
    id: ${id_prefix}_w5500_cmd_max
    name: "W5500 Command Max"
    entity_category: "diagnostic"

# RESEARCH SPIKE -- CLOSED 2026-09-04, disabled. The W5500 has ONE INTn pin shared by all
# sockets, so a socket-1 interrupt IS socket 0's interrupt for the same frame: an earlier
# hardware T2 stamp is physically impossible, which was the whole point. Socket 1 UDP does
# coexist with MACRAW (interrupt masked), TCP mode black-holes all TCP, and SIMR=0x03 wedges
