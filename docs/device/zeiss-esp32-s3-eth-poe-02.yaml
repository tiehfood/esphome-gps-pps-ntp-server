external_components:
  - source:
      type: local
      path: ./ntp
    components: [ ntp_server, gps_pps_time, ethernet ]


light:
  - platform: esp32_rmt_led_strip
    channel_colors: GRB
    pin: GPIO21 
    num_leds: 4
    chipset: ws2812
    name: "${name} RGB LED"
    id: ${id_prefix}_rgb
    
switch:
  # A/B: serve timestamps from the PPS anchor instead of gettimeofday(). Watch precision
  # in the NTP header and t3_error; both should improve, and neither clock_offset nor
  # int_lead should move.
  - platform: template
    name: "NTP PPS Anchor"
    id: ${id_prefix}_pps_anchor
    entity_category: "diagnostic"
    optimistic: true
    restore_mode: ALWAYS_ON
    turn_on_action:
      - lambda: 'id(${id_prefix}_ntp).set_use_pps_anchor(true);'
    turn_off_action:
      - lambda: 'id(${id_prefix}_ntp).set_use_pps_anchor(false);'

  # A/B: the anchor's frequency term from the MCPWM-captured crystal rate (ON, default) versus
  # the legacy position-mean estimate it replaced (OFF). Measured with the P4 probe.
  - platform: template
    name: "NTP HW Rate Term"
    id: ${id_prefix}_hw_rate_term
    entity_category: "diagnostic"
    optimistic: true
    restore_mode: ALWAYS_ON
    turn_on_action:
      - lambda: 'id(${id_prefix}_pps).set_use_hw_rate(true);'
    turn_off_action:
      - lambda: 'id(${id_prefix}_pps).set_use_hw_rate(false);'

  # Stall investigation (off by default): per-request records on the S3 and a W5500 network
  # activity recorder, pulled over UDP 12301 after a test run. Adds no traffic while on.
  - platform: template
    name: "NTP Diagnostics"
    id: ${id_prefix}_ntp_diagnostics
    entity_category: "diagnostic"
    optimistic: true
    restore_mode: ALWAYS_OFF
    turn_on_action:
      - lambda: 'id(${id_prefix}_ntp).set_diagnostics(true);'
    turn_off_action:
      - lambda: 'id(${id_prefix}_ntp).set_diagnostics(false);'

  # On by default (verified 2026-09-11: replies off by more than 1 ms 6.86 -> 0.53 per 1000):
  # refuse on a tight (200us) or missing INTn edge lead instead of the legacy 1ms-only rule. Kept
  # as a switch for later A/Bs; re-evaluated per request, so it takes effect immediately.
  - platform: template
    name: "NTP Strict RX Admission"
    id: ${id_prefix}_ntp_strict_rx_admission
    entity_category: "diagnostic"
    optimistic: true
    restore_mode: ALWAYS_ON
    turn_on_action:
      - lambda: 'id(${id_prefix}_ntp).set_strict_rx_admission(true);'
    turn_off_action:
      - lambda: 'id(${id_prefix}_ntp).set_strict_rx_admission(false);'

  # On by default since 2026-09-13 (A'' verified: replies served late > 150 us 0.64 -> 0.19%,
  # for +0.18 points of refusals). Shortens the W5500's own INTLEVEL (interrupt assert wait time)
  # from the driver's boot default 0xFFFF (~1.748 ms) to 0x0FFF (~109 us). A live register write
  # with no independent recovery path if it went wrong, so the firmware defers applying it for
  # 60 s after every boot -- a guaranteed OTA window with the driver's own 0xFFFF still in place
  # -- instead of the time-bounded dead-man revert this replaced.
  - platform: template
    name: "NTP W5500 Short Interrupt Wait"
    id: ${id_prefix}_ntp_w5500_short_int_wait
    entity_category: "diagnostic"
    restore_mode: ALWAYS_ON
    lambda: 'return id(${id_prefix}_ntp).short_int_wait_active();'
    turn_on_action:
      - lambda: 'id(${id_prefix}_ntp).set_short_int_wait(true);'
    turn_off_action:
      - lambda: 'id(${id_prefix}_ntp).set_short_int_wait(false);'

  # On by default (verified 2026-09-11: per-sample offset sigma 7.14 -> 2.83 us, no checksum
  # errors; its +10 us offset shift removes the old path's early T3). Rewrites T3 and the UDP
  # checksum into the reply's bytes already queued in the W5500 TX buffer, immediately before
  # the SEND that transmits it. See ntp_tx_patch.h. Kept as a switch for later A/Bs.
  - platform: template
    name: "NTP Post-Write T3"
    id: ${id_prefix}_ntp_post_write_t3
    entity_category: "diagnostic"
    optimistic: true
    restore_mode: ALWAYS_ON
    turn_on_action:
      - lambda: 'id(${id_prefix}_ntp).set_post_write_t3(true);'
    turn_off_action:
      - lambda: 'id(${id_prefix}_ntp).set_post_write_t3(false);'

  - platform: template
    name: "${name} RGB LED"
    id: ${id_prefix}_rgb_led_switch
    turn_on_action:
      - light.turn_on: ${id_prefix}_rgb
    turn_off_action:
      - light.turn_off: ${id_prefix}_rgb

sensor:
  - platform: uptime
    id: ${id_prefix}_uptime
    name: "Uptime"
    update_interval: 60s
    icon: mdi:clock-outline
    entity_category: "diagnostic"
  - platform: internal_temperature
    id: ${id_prefix}_internal_temperature
    name: "Internal Temperature"
    entity_category: "diagnostic"
  - platform: dallas_temp
    address: 0xab0000007d86de28
    id: temperature_ntp
    name: NTP Server
    update_interval: 600s
  - platform: debug
    free:
      name: "Heap Free"
      icon: "mdi:memory"
      entity_category: "diagnostic"
    psram:
      name: "Free PSRAM"
      icon: "mdi:memory"
      entity_category: "diagnostic"
    loop_time:
      name: "Loop Time"
      icon: "mdi:timer-outline"
      entity_category: "diagnostic"

text_sensor:
  - platform: version
    id: ${id_prefix}_version
    name: "Version"
    icon: mdi:cube-outline
    entity_category: "diagnostic"
  - platform: debug
    reset_reason:
      name: "Reset Reason"
      icon: "mdi:restart-alert"
      entity_category: "diagnostic"
    device:
      name: "Device Info"
      entity_category: "diagnostic"

button:
  - platform: restart
    id: ${id_prefix}_restart
    name: Restart
    icon: mdi:restart
    entity_category: "diagnostic"
