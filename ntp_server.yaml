packages:
  base: !include config_example.yaml

external_components:
  - source:
      type: local
      path: components

# The local `ethernet` component shadows ESPHome's built-in one. It is REQUIRED:
# ntp_server's receive-timestamp hook needs get_eth_handle()/get_eth_netif() from it,
# and w5500_probe below shares its spi_device_handle_t via ethernet::w5500_shared_spi()
# rather than creating a second SPI device (see components/ethernet/ethernet_component.h
# and components/w5500_probe/ for why exactly one device must exist).
#
# id: added here (merges with config_example.yaml's pins/type) so w5500_probe can
# reference this instance via `use_id`; config_example.yaml itself stays untouched.
ethernet:
  id: eth_component

uart:
  id: gps_uart
  rx_pin: GPIO43
  tx_pin: GPIO44
  baud_rate: 115200

gps:
  id: gps_module
  uart_id: gps_uart

time:
  - platform: gps_pps_time
    id: gps_pps
    gps_id: gps_module
    pps_pin: GPIO1
    update_interval: 60s
    satellites:
      id: total_satellites
      name: "Satellites"
      icon: "mdi:satellite-variant"
      accuracy_decimals: 0
      state_class: measurement
      force_update: false
      disabled_by_default: false
      internal: false
    clock_offset:
      id: ntp_clock_offset
      name: "Clock Offset"
      icon: "mdi:clock-check-outline"
      unit_of_measurement: "µs"
      accuracy_decimals: 0
      state_class: measurement
    pps_drift:
      id: pps_raw_drift
      name: "PPS Drift"
      icon: "mdi:clock-alert-outline"
      unit_of_measurement: "µs"
      accuracy_decimals: 0
      state_class: measurement
    gps_time:
      id: gps_current_time
      name: "GPS Time"
      icon: "mdi:clock-outline"
      entity_category: "diagnostic"
    gps_satellites:
      id: gps_sat_count
      name: "GPS Satellites"
      icon: "mdi:satellite-variant"
      accuracy_decimals: 0
      state_class: measurement
    glonass_satellites:
      id: glonass_sat_count
      name: "GLONASS Satellites"
      icon: "mdi:satellite-variant"
      accuracy_decimals: 0
      state_class: measurement
    galileo_satellites:
      id: galileo_sat_count
      name: "Galileo Satellites"
      icon: "mdi:satellite-variant"
      accuracy_decimals: 0
      state_class: measurement
    nmea_clock_delta:
      id: nmea_clock_delta
      name: "NMEA Clock Delta"
      icon: "mdi:clock-alert"
      unit_of_measurement: "ms"
      accuracy_decimals: 0
      state_class: measurement
      entity_category: "diagnostic"
    crash_info:
      id: last_crash_info
      name: "Last Crash Info"
      icon: "mdi:alert-circle-outline"
      entity_category: "diagnostic"

debug:
  update_interval: 60s

sensor:
  - platform: debug
    free:
      name: "Heap Free"
      icon: "mdi:memory"
      entity_category: "diagnostic"
    block:
      name: "Heap Max Block"
      icon: "mdi:memory"
      entity_category: "diagnostic"
    loop_time:
      name: "Loop Time"
      icon: "mdi:timer-outline"
      entity_category: "diagnostic"
    psram:
      name: "PSRAM Free"
      icon: "mdi:memory"
      entity_category: "diagnostic"

text_sensor:
  - platform: debug
    device:
      name: "Device Info"
      entity_category: "diagnostic"
    reset_reason:
      name: "Reset Reason"
      icon: "mdi:restart-alert"
      entity_category: "diagnostic"

ntp_server:
  time_id: gps_pps
  hook_latency:
    id: ntp_hook_latency
    name: "NTP Hook Latency"
    icon: "mdi:timer-sand"
    entity_category: "diagnostic"

w5500_probe:
  ethernet_id: eth_component
  probe_button:
    id: w5500_probe_button
    name: "W5500 Probe: Open Socket 1"
    entity_category: "diagnostic"
  alt_port_button:
    id: w5500_probe_alt_port_button
    name: "W5500 Probe: Open Socket 1 (port 12345)"
    entity_category: "diagnostic"
  poll_only_button:
    id: w5500_probe_poll_only_button
    name: "W5500 Probe: Poll Only (control)"
    entity_category: "diagnostic"
  dump_config_button:
    id: w5500_probe_dump_config
    name: "W5500 Probe: Dump Config"
    entity_category: "diagnostic"
  simr_button:
    id: w5500_probe_simr
    name: "W5500 Probe: Open Socket 1 + SIMR"
    entity_category: "diagnostic"
  recover_button:
    id: w5500_probe_recover_button
    name: "W5500 Probe: Recover"
    entity_category: "diagnostic"
  rx_bytes:
    id: w5500_probe_rx_bytes
    name: "W5500 Probe RX Bytes"
    entity_category: "diagnostic"
  socket_status:
    id: w5500_probe_socket_status
    name: "W5500 Probe Socket Status"
    entity_category: "diagnostic"
