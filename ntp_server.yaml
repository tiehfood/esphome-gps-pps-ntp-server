packages:
  base: !include config_example.yaml

external_components:
  - source:
      type: local
      path: components

# RESEARCH SPIKE (throwaway) -- see components/w5500_probe/w5500_probe.h and
# docs/superpowers/plans/2026-09-03-ntp-serving-latency.md. Overrides the built-in
# `ethernet` component (same name, shadowed via external_components) purely to expose
# an id and a couple of getters that w5500_probe needs; behaviour is unchanged.
ethernet:
  id: eth_component

w5500_probe:
  ethernet_id: eth_component
  probe_button:
    name: "W5500 Probe: Run Sequence"
    entity_category: "diagnostic"
  recover_button:
    name: "W5500 Probe: Recover"
    entity_category: "diagnostic"
  rx_bytes:
    name: "W5500 Probe: Socket 1 RX Bytes"
    entity_category: "diagnostic"
  socket_status:
    name: "W5500 Probe: Socket 1 Status"
    entity_category: "diagnostic"

uart:
  id: gps_uart
  rx_pin: GPIO43
  tx_pin: GPIO44
  baud_rate: 115200

gps:
  id: gps_module
  uart_id: gps_uart

time:
  - platform: gps_pps_time
    id: gps_pps
    gps_id: gps_module
    pps_pin: GPIO1
    update_interval: 60s
    satellites:
      id: total_satellites
      name: "Satellites"
      icon: "mdi:satellite-variant"
      accuracy_decimals: 0
      state_class: measurement
      force_update: false
      disabled_by_default: false
      internal: false
    clock_offset:
      id: ntp_clock_offset
      name: "Clock Offset"
      icon: "mdi:clock-check-outline"
      unit_of_measurement: "µs"
      accuracy_decimals: 0
      state_class: measurement
    pps_drift:
      id: pps_raw_drift
      name: "PPS Drift"
      icon: "mdi:clock-alert-outline"
      unit_of_measurement: "µs"
      accuracy_decimals: 0
      state_class: measurement
    gps_time:
      id: gps_current_time
      name: "GPS Time"
      icon: "mdi:clock-outline"
      entity_category: "diagnostic"
    gps_satellites:
      id: gps_sat_count
      name: "GPS Satellites"
      icon: "mdi:satellite-variant"
      accuracy_decimals: 0
      state_class: measurement
    glonass_satellites:
      id: glonass_sat_count
      name: "GLONASS Satellites"
      icon: "mdi:satellite-variant"
      accuracy_decimals: 0
      state_class: measurement
    galileo_satellites:
      id: galileo_sat_count
      name: "Galileo Satellites"
      icon: "mdi:satellite-variant"
      accuracy_decimals: 0
      state_class: measurement
    crash_info:
      id: last_crash_info
      name: "Last Crash Info"
      icon: "mdi:alert-circle-outline"
      entity_category: "diagnostic"

debug:
  update_interval: 60s

sensor:
  - platform: debug
    free:
      name: "Heap Free"
      icon: "mdi:memory"
      entity_category: "diagnostic"
    block:
      name: "Heap Max Block"
      icon: "mdi:memory"
      entity_category: "diagnostic"
    loop_time:
      name: "Loop Time"
      icon: "mdi:timer-outline"
      entity_category: "diagnostic"
    psram:
      name: "PSRAM Free"
      icon: "mdi:memory"
      entity_category: "diagnostic"

text_sensor:
  - platform: debug
    device:
      name: "Device Info"
      entity_category: "diagnostic"
    reset_reason:
      name: "Reset Reason"
      icon: "mdi:restart-alert"
      entity_category: "diagnostic"

ntp_server:
  time_id: gps_pps
